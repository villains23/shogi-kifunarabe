<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棋譜トレーナー</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
background:#111;
color:white;
display:flex;
flex-direction:column;
min-height:100vh;
}

header{
padding:12px;
background:#181818;
border-bottom:1px solid #333;
display:flex;
gap:8px;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:10px;
background:#2b2b2b;
color:white;
font-size:16px;
}

button:hover{
background:#3a3a3a;
}

main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

#moveDisplay{
font-size:60px;
font-weight:700;
margin-bottom:20px;
}

#moveNo{
color:#aaa;
margin-bottom:10px;
}

.footerButtons{
display:flex;
gap:10px;
justify-content:center;
margin-top:20px;
}

.resultPanel{
margin-top:20px;
background:#1a1a1a;
padding:15px;
border-radius:10px;
}

</style>
</head>

<body>

<header>

<input type="file" id="fileInput">

<button onclick="prevMove()">戻る</button>
<button onclick="nextMove()">次へ</button>
<button onclick="resetMoves()">最初へ</button>
<button onclick="toggleAnswer()">表示/非表示</button>

</header>

<main>

<div>

<div id="moveNo">0手目</div>

<div id="moveDisplay">棋譜を読み込んでください</div>

<div class="footerButtons">

<button onclick="judgeMove('correct')" id="correctBtn">当たり</button>
<button onclick="judgeMove('close')" id="closeBtn">惜しい</button>
<button onclick="judgeMove('wrong')" id="wrongBtn">外れ</button>

</div>

<div class="resultPanel">

<div id="summary">未記録</div>

</div>

</div>

</main>

<script>

let moves=[]
let index=-1
let judges=[]
let answerVisible=true

function parseKif(text){

let lines=text.split("\n")
let result=[]

for(let line of lines){

line=line.trim()

if(!line)continue
if(line.startsWith("*"))continue
if(line.startsWith("**"))continue
if(line.startsWith("#"))continue

let m=line.match(/^(\d+)\s+(.+)/)

if(!m)continue

let moveNo=parseInt(m[1])
let moveText=m[2].replace(/\s+\(.*/,"")

let prefix=moveNo%2? "▲":"△"

result.push(prefix+moveText)

}

return result

}

function render(){

let moveDisplay=document.getElementById("moveDisplay")
let moveNo=document.getElementById("moveNo")

if(index<0){

moveDisplay.textContent="タップして開始"
moveNo.textContent="0手目"

}else{

moveNo.textContent=(index+1)+"手目"

moveDisplay.textContent=answerVisible?moves[index]:"？？？"

}

updateSummary()

}

function nextMove(){

if(index<moves.length-1){

index++
answerVisible=true
render()

}

}

function prevMove(){

if(index>-1){

index--
render()

}

}

function resetMoves(){

index=-1
render()

}

function toggleAnswer(){

answerVisible=!answerVisible
render()

}

function judgeMove(type){

if(index<0)return

if(judges[index])return

judges[index]=type

render()

}

function getCounts(){

let correct=0
let close=0
let wrong=0

for(let j of judges){

if(j==="correct")correct++
if(j==="close")close++
if(j==="wrong")wrong++

}

return{correct,close,wrong}

}

function updateSummary(){

let s=document.getElementById("summary")

let c=getCounts()

let total=c.correct+c.close+c.wrong

if(total===0){

s.innerHTML="未記録"
return

}

let correctRate=(c.correct/total*100).toFixed(1)
let closeRate=(c.close/total*100).toFixed(1)
let wrongRate=(c.wrong/total*100).toFixed(1)

s.innerHTML=

`当たり: ${c.correct}<br>
惜しい: ${c.close}<br>
外れ: ${c.wrong}<br>
当たり率: ${correctRate}%<br>
惜しい率: ${closeRate}%<br>
外れ率: ${wrongRate}%`

}

document.getElementById("fileInput").addEventListener("change",async e=>{

let file=e.target.files[0]

let text=await file.text()

moves=parseKif(text)

judges=new Array(moves.length).fill(null)

index=-1

render()

})

document.addEventListener("keydown",function(e){

if(e.key==="Enter"||e.key==="."||e.key===">"){

nextMove()

}

if(e.key===","||e.key==="<"){

prevMove()

}

if(e.key===" "){

toggleAnswer()

}

if(e.key==="1"){

judgeMove("correct")

}

if(e.key==="2"){

judgeMove("close")

}

if(e.key==="3"){

judgeMove("wrong")

}

})

render()

</script>

</body>
</html>
